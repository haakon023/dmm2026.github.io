<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Game Route – Checklist</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }
        h2 {
            color: #4fc3f7;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .checklist {
            list-style: none;
            padding: 0;
        }
        .checklist li {
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .checklist input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4caf50;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .checklist label {
            cursor: pointer;
            flex: 1;
        }
        .checklist input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888;
        }
        .points {
            color: #ffd700;
            font-weight: bold;
        }
        .note {
            color: #ff9800;
            font-style: italic;
        }
        .sub-list {
            margin-left: 30px;
            margin-top: 5px;
        }
        .section-with-image {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .section-with-image h2 {
            margin-top: 0;
        }
        .section-content {
            flex: 1;
        }
        .section-image {
            max-width: 400px;
            border: 2px solid #4fc3f7;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .section-image:hover {
            transform: scale(1.02);
        }
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal img {
            max-width: 95%;
            max-height: 95%;
        }
        .user-steps {
            background: #2a2a4e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 30px;
        }
        .user-steps h2 {
            margin-top: 0;
        }
        .add-step-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .add-step-form input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #4fc3f7;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
        }
        .add-step-form button {
            padding: 8px 16px;
            background: #4fc3f7;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-step-form button:hover {
            background: #81d4fa;
        }
        .user-step-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 16px;
            padding: 0 5px;
        }
        .delete-btn:hover {
            color: #ff8a80;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ff5252;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .reset-btn:hover {
            background: #ff1744;
        }
        .points-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a4e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            text-align: center;
        }
        .points-counter .label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .points-counter .value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <h1>Early Game Route – Checklist</h1>

    <div id="checklist-container"></div>
    <div id="image-modal" class="image-modal">
        <img src="" alt="Expanded view">
    </div>
    <button class="reset-btn" id="reset-btn">Reset All</button>
    <div class="points-counter">
        <div class="label">Points</div>
        <div class="value" id="points-value">0</div>
    </div>

    <script src="steps.js"></script>
    <script>
        const container = document.getElementById('checklist-container');
        const modal = document.getElementById('image-modal');
        const modalImg = modal.querySelector('img');

        modal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        const pointsDisplay = document.getElementById('points-value');
        const itemPoints = {}; // Store points for each checkbox id

        function parsePoints(pointsStr) {
            if (!pointsStr) return 0;
            const match = pointsStr.match(/(-?\+?)(\d+)/);
            if (!match) return 0;
            const num = parseInt(match[2]);
            return match[1] === '-' ? -num : num;
        }

        function updatePointsCounter() {
            let total = 0;
            for (const [id, points] of Object.entries(itemPoints)) {
                if (localStorage.getItem(id) === 'true') {
                    total += points;
                }
            }
            pointsDisplay.textContent = total;
        }

        let itemIndex = 1;

        checklistData.forEach(section => {
                    const sectionDiv = document.createElement('div');
                    if (section.image) {
                        sectionDiv.className = 'section-with-image';
                    }

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'section-content';

                    const h2 = document.createElement('h2');
                    h2.textContent = section.title;
                    contentDiv.appendChild(h2);

                    const ul = document.createElement('ul');
                    ul.className = 'checklist';

                    section.items.forEach(item => {
                        const li = document.createElement('li');
                        const id = `c${itemIndex++}`;

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = id;
                        checkbox.checked = localStorage.getItem(id) === 'true';

                        const points = parsePoints(item.points);
                        if (points !== 0) itemPoints[id] = points;

                        checkbox.addEventListener('change', () => {
                            localStorage.setItem(id, checkbox.checked);
                            updatePointsCounter();
                        });

                        const label = document.createElement('label');
                        label.setAttribute('for', id);

                        let labelHTML = item.label;
                        if (item.points) {
                            labelHTML += ` <span class="points">(${item.points})</span>`;
                        }
                        if (item.note) {
                            labelHTML += ` <span class="note">(${item.note})</span>`;
                        }
                        label.innerHTML = labelHTML;

                        li.appendChild(checkbox);
                        li.appendChild(label);
                        ul.appendChild(li);
                    });

                    contentDiv.appendChild(ul);
                    sectionDiv.appendChild(contentDiv);

                    if (section.image) {
                        const img = document.createElement('img');
                        img.src = section.image;
                        img.alt = section.title + ' map';
                        img.className = 'section-image';
                        img.addEventListener('click', () => {
                            modalImg.src = img.src;
                            modal.classList.add('active');
                        });
                        sectionDiv.appendChild(img);
                    }

            container.appendChild(sectionDiv);
        });

        // User-defined steps
        const userStepsSection = document.createElement('div');
        userStepsSection.className = 'user-steps';
        userStepsSection.innerHTML = `
            <h2>Pre-game Checklist</h2>
            <div class="add-step-form">
                <input type="text" id="new-step-input" placeholder="Add custom step (e.g. Check F keys, Resolution)">
                <button id="add-step-btn">Add</button>
            </div>
            <ul id="user-steps-list" class="checklist"></ul>
        `;
        container.insertBefore(userStepsSection, container.firstChild);

        const userStepsList = document.getElementById('user-steps-list');
        const newStepInput = document.getElementById('new-step-input');
        const addStepBtn = document.getElementById('add-step-btn');

        function getUserSteps() {
            return JSON.parse(localStorage.getItem('userSteps') || '[]');
        }

        function saveUserSteps(steps) {
            localStorage.setItem('userSteps', JSON.stringify(steps));
        }

        function renderUserSteps() {
            const steps = getUserSteps();
            userStepsList.innerHTML = '';
            steps.forEach((step, index) => {
                const li = document.createElement('li');
                li.className = 'user-step-item';
                const id = `user-step-${index}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = id;
                checkbox.checked = localStorage.getItem(id) === 'true';
                checkbox.addEventListener('change', () => {
                    localStorage.setItem(id, checkbox.checked);
                });

                const label = document.createElement('label');
                label.setAttribute('for', id);
                label.textContent = step;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '×';
                deleteBtn.addEventListener('click', () => {
                    const steps = getUserSteps();
                    steps.splice(index, 1);
                    saveUserSteps(steps);
                    renderUserSteps();
                });

                li.appendChild(checkbox);
                li.appendChild(label);
                li.appendChild(deleteBtn);
                userStepsList.appendChild(li);
            });
        }

        function addUserStep() {
            const text = newStepInput.value.trim();
            if (text) {
                const steps = getUserSteps();
                steps.push(text);
                saveUserSteps(steps);
                newStepInput.value = '';
                renderUserSteps();
            }
        }

        addStepBtn.addEventListener('click', addUserStep);
        newStepInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addUserStep();
        });

        renderUserSteps();
        updatePointsCounter();

        // Reset button
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Reset all checkboxes?')) {
                // Clear all checkbox states
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (key.startsWith('c') || key.startsWith('user-step-'))) {
                        localStorage.removeItem(key);
                        i--;
                    }
                }
                // Uncheck all visible checkboxes
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });
                updatePointsCounter();
            }
        });
    </script>
</body>
</html>
